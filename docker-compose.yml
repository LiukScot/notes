services:
  notes:
    build: .
    container_name: notes
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/server/data:/app/apps/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=http://192.168.1.6:3000,http://100.75.217.127:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./apps/server/src
          target: /app/apps/server/src
        - action: sync+restart
          path: ./packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
