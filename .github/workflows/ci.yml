name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck (turbo)
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build (turbo)
        run: bun run build

  unit-server:
    name: Unit (apps/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run server unit tests
        run: bun test apps/server/src/

  unit-shared:
    name: Unit (packages/shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run shared unit tests
        run: bun test packages/shared/src/

  component-web:
    name: Component (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run web component tests
        working-directory: apps/web
        run: bunx vitest run
